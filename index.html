<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Đo mức cường Độ Âm</title>
    <!-- Thư viện tạo mã QR tự động -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        :root {
            --bg-top: #1e293b;
            --bg-bottom: #0f172a;
            --panel-bg: rgba(255, 255, 255, 0.1);
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --border-color: rgba(255, 255, 255, 0.2);
            --safe-color: #22c55e;   
            --danger-color: #ef4444; 
            --reset-color: #f59e0b;  
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        /* KHÓA CHẶT TRANG WEB TRONG KHUÔN HÌNH - KHÔNG CUỘN */
        body, html {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: linear-gradient(135deg, var(--bg-top) 0%, var(--bg-bottom) 100%);
            color: var(--text-main);
            height: 100vh;
            width: 100vw;
            overflow: hidden; 
            display: flex;
            flex-direction: column;
        }

        /* ================= TOOLBAR PHÍA TRÊN ================= */
        .top-toolbar {
            background: var(--panel-bg);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border-color);
            padding: 10px 15px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            z-index: 10;
            flex-shrink: 0;
            position: relative;
        }

        .tool-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            flex-wrap: wrap;
            padding-right: 80px; /* Chừa khoảng trống cho khung QR ở góc */
        }

        /* Khung chứa mã QR nhỏ gọn ở góc trên bên phải */
        .qr-corner {
            position: absolute;
            top: 10px;
            right: 15px;
            background: white;
            padding: 4px 6px;
            border-radius: 6px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .qr-corner span {
            font-size: 9px;
            color: #0f172a;
            font-weight: bold;
            margin-top: 2px;
            white-space: nowrap;
        }

        .tool-row label {
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 5px;
            white-space: nowrap;
        }

        select {
            flex: 1;
            padding: 6px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            background: rgba(255,255,255,0.9);
            font-size: 13px;
            outline: none;
            min-width: 120px;
        }

        input[type="range"] {
            width: 100px;
            accent-color: #38bdf8;
        }

        button {
            background-color: #38bdf8;
            color: #0f172a;
            border: none;
            padding: 6px 12px;
            font-size: 13px;
            font-weight: 700;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
        }

        button:active { transform: scale(0.95); }
        button:disabled { background-color: #64748b; color: #cbd5e1; cursor: not-allowed; }
        
        button.start-btn { background-color: var(--safe-color); color: white; flex: 2; padding: 8px; font-size: 14px;}
        button.stop-btn { background-color: var(--danger-color); color: white; flex: 2; padding: 8px; font-size: 14px;}
        button.reset-btn { background-color: var(--reset-color); color: white; flex: 1; padding: 8px; font-size: 14px;}

        #statusText {
            font-size: 12px;
            color: #cbd5e1;
            text-align: center;
            width: 100%;
            margin-top: -2px;
        }

        /* ================= KHU VỰC HIỂN THỊ TRUNG TÂM ================= */
        .main-display {
            flex: 1; 
            display: flex;
            flex-direction: row; 
            padding: 15px;
            gap: 20px;
            min-height: 0; 
            box-sizing: border-box;
        }

        /* KHUNG CHỮ NHẬT LẤP ĐẦY KHÔNG GIAN */
        .db-container {
            flex: 1; 
            height: 100%;
            min-width: 0; 
            min-height: 0; 
            display: flex;
            align-items: stretch;
            justify-content: stretch;
            padding: 0px; 
        }

        .db-box {
            flex: 1; 
            container-type: size; 
            background: rgba(15, 23, 42, 0.5);
            border: 8px solid var(--safe-color); 
            border-radius: 30px; 
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 40px rgba(34, 197, 94, 0.15);
            transition: border-color 0.15s ease-out, box-shadow 0.15s ease-out;
            box-sizing: border-box;
            padding: 5px; 
        }

        .db-readout {
            display: flex;
            align-items: baseline; 
            justify-content: center;
            gap: 1.5cqw; 
            width: 100%;
            color: var(--safe-color); 
            transition: color 0.15s ease-out;
        }

        .db-value {
            font-size: min(19cqw, 65cqh); 
            font-weight: 900;
            color: inherit; 
            line-height: 1;
            font-family: 'Times New Roman', Times, serif; 
            font-variant-numeric: tabular-nums; 
        }

        .db-unit {
            font-size: min(19cqw, 65cqh); 
            font-weight: 900;
            color: inherit; 
            font-family: 'Times New Roman', Times, serif; 
        }

        /* ĐỒ THỊ BIỂU ĐỒ (dB vs Thời gian) */
        .canvas-container {
            width: 100%;
            height: 200px; 
            background: rgba(15, 23, 42, 0.9);
            border-top: 1px solid var(--border-color);
            flex-shrink: 0; 
            position: relative;
        }

        canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* RESPONSIVE ĐIỆN THOẠI */
        @media (max-width: 768px) {
            .top-toolbar { padding-right: 15px; }
            .qr-corner { display: none; }
            .tool-row { padding-right: 0; }
            .main-display { padding: 10px; }
            .db-box { border-width: 6px; border-radius: 20px; }
            .canvas-container { height: 150px; }
        }
    </style>
</head>
<body>

    <!-- BẢNG ĐIỀU KHIỂN -->
    <div class="top-toolbar">
        <div class="qr-corner">
            <div id="qrcode"></div>
            <span>ĐO MCĐ ÂM</span>
        </div>

        <div class="tool-row">
            <button id="micBtn">1. Cấp quyền Micro</button>
            <select id="micSelect">
                <option value="">-- Chọn thiết bị thu --</option>
            </select>
        </div>
        
        <div class="tool-row">
            <label>Khuyếch đại: <input type="range" id="gainRange" min="1" max="50" step="0.5" value="1"></label>
            <label><input type="checkbox" id="filterToggle" checked> Lọc âm</label>
            <button id="calibrateBtn">Hiệu chuẩn</button>
        </div>

        <div class="tool-row" style="display: flex;">
            <button id="measureBtn" class="start-btn" disabled>2. Bắt đầu đo</button>
            <button id="resetBtn" class="reset-btn">3. Reset</button>
        </div>
        <div id="statusText">Vui lòng Cấp quyền Micro để bắt đầu.</div>
    </div>

    <!-- GIAO DIỆN HIỂN THỊ CHÍNH -->
    <div class="main-display">
        <div class="db-container">
            <div id="dbBox" class="db-box">
                <div id="dbReadout" class="db-readout">
                    <div id="dbDisplay" class="db-value">0.00</div>
                    <div class="db-unit">dB</div>
                </div>
            </div>
        </div>
    </div>

    <!-- ĐỒ THỊ CỘT NĂNG LƯỢNG -->
    <div class="canvas-container" id="canvasContainer">
        <canvas id="waveformCanvas"></canvas>
    </div>

<script>
    // Tự động tạo mã QR dựa theo link hiện tại của trang web
    window.addEventListener('load', () => {
        const qrContainer = document.getElementById("qrcode");
        if (qrContainer && typeof QRCode !== 'undefined') {
            new QRCode(qrContainer, {
                text: window.location.href,
                width: 64,
                height: 64,
                colorDark : "#0f172a",
                colorLight : "#ffffff",
                correctLevel : QRCode.CorrectLevel.M
            });
        }
        drawEmptyGraph();
    });

    let audioCtx = null;
    let analyser = null;
    let microphone = null;
    let gainNode = null;
    let biquadFilter = null;
    let mediaStream = null;
    let isMeasuring = false;
    let animationId = null;
    let noiseFloorOffset = 0;

    const GRAPH_MAX_DB = 310; 

    // Các biến phục vụ đo lường 0.01s (10ms) và giới hạn 10s
    let autoLogInterval = null;
    let measureTimer = null;
    let currentRmsDb = 0; 
    let windowSumDb = 0;
    let windowCountFrames = 0;
    let dbHistory = []; 
    let selectedBarIndex = -1; // Cột đang được chọn để xem số liệu

    const micBtn = document.getElementById('micBtn');
    const measureBtn = document.getElementById('measureBtn');
    const resetBtn = document.getElementById('resetBtn');
    const calibrateBtn = document.getElementById('calibrateBtn');
    
    const dbReadout = document.getElementById('dbReadout');
    const dbDisplay = document.getElementById('dbDisplay');
    const dbBox = document.getElementById('dbBox'); 
    
    const gainRange = document.getElementById('gainRange');
    const filterToggle = document.getElementById('filterToggle');
    const statusText = document.getElementById('statusText');
    const micSelect = document.getElementById('micSelect');
    
    const canvas = document.getElementById('waveformCanvas');
    const canvasCtx = canvas.getContext('2d');

    window.onresize = () => { if(!isMeasuring) drawEmptyGraph(); };

    // 1. Cấp quyền & Chọn Micro
    micBtn.addEventListener('click', async () => {
        try {
            let tempStream = await navigator.mediaDevices.getUserMedia({ audio: true });
            const devices = await navigator.mediaDevices.enumerateDevices();
            const audioInputs = devices.filter(device => device.kind === 'audioinput');
            
            micSelect.innerHTML = ''; 
            
            if (audioInputs.length === 0) {
                const option = document.createElement('option');
                option.text = "Không tìm thấy Micro!";
                micSelect.appendChild(option);
                throw new Error("No input devices found.");
            }

            audioInputs.forEach((device, index) => {
                const option = document.createElement('option');
                option.value = device.deviceId;
                option.text = device.label || `Micro ${index + 1}`;
                micSelect.appendChild(option);
            });

            tempStream.getTracks().forEach(track => track.stop());

            micBtn.innerText = "Đã kết nối ✓"; 
            micBtn.style.backgroundColor = "#16a34a"; 
            measureBtn.disabled = false;
            statusText.innerText = "Đã kết nối Micro. Hãy bấm Bắt đầu đo."; 
        } catch (err) {
            alert("Lỗi Micro: Vui lòng cho phép quyền truy cập Micro. " + err);
        }
    });

    // 2. Chức năng khuếch đại (Gain)
    gainRange.addEventListener('input', (e) => {
        if (gainNode) gainNode.gain.value = parseFloat(e.target.value);
    });

    filterToggle.addEventListener('change', (e) => {
        if (biquadFilter && audioCtx) {
            biquadFilter.type = e.target.checked ? 'bandpass' : 'allpass';
            biquadFilter.frequency.value = 1000;
        }
    });

    // 3. Bắt đầu đo
    measureBtn.addEventListener('click', async () => {
        if (!isMeasuring) {
            try {
                const selectedDeviceId = micSelect.value;
                const constraints = {
                    audio: {
                        deviceId: selectedDeviceId ? { exact: selectedDeviceId } : undefined,
                        echoCancellation: false, 
                        noiseSuppression: false, 
                        autoGainControl: false
                    },
                    video: false
                };

                mediaStream = await navigator.mediaDevices.getUserMedia(constraints);
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                microphone = audioCtx.createMediaStreamSource(mediaStream);
                
                biquadFilter = audioCtx.createBiquadFilter();
                biquadFilter.type = filterToggle.checked ? 'bandpass' : 'allpass';
                biquadFilter.frequency.value = 1000;

                gainNode = audioCtx.createGain();
                gainNode.gain.value = parseFloat(gainRange.value);

                analyser = audioCtx.createAnalyser();
                analyser.fftSize = 1024;
                analyser.smoothingTimeConstant = 0.8;

                microphone.connect(biquadFilter);
                biquadFilter.connect(gainNode);
                gainNode.connect(analyser);

                isMeasuring = true;
                selectedBarIndex = -1; // Reset lựa chọn cột
                measureBtn.innerText = "Dừng đo";
                measureBtn.className = "stop-btn";
                micSelect.disabled = true; 
                statusText.innerText = "Đang đo liên tục 0.01s/lần (Tối đa 10s)...";

                dbHistory = [];
                windowSumDb = 0;
                windowCountFrames = 0;
                
                startAutoLogger();
                
                // Tự động dừng đo sau 10 giây
                measureTimer = setTimeout(() => {
                    if (isMeasuring) {
                        stopMeasurement();
                        statusText.innerText = "Đã hoàn thành lượt đo 10s (Bấm/Chạm vào thanh bất kỳ để xem số liệu).";
                    }
                }, 10000);

                visualize();
            } catch (err) {
                alert("Lỗi kết nối Micro: " + err);
            }
        } else {
            stopMeasurement();
            statusText.innerText = "Đã tạm dừng thủ công (Bấm/Chạm vào thanh bất kỳ để xem số liệu).";
        }
    });

    // Cập nhật lấy mẫu cột 0.01s (10ms) một lần
    function logDataTick() {
        if (!isMeasuring) return;

        let avgDb = windowCountFrames > 0 ? (windowSumDb / windowCountFrames) : currentRmsDb;
        dbHistory.push(avgDb);

        windowSumDb = 0;
        windowCountFrames = 0;
        drawGraphGrid();
    }

    function startAutoLogger() {
        if (autoLogInterval) clearInterval(autoLogInterval);
        autoLogInterval = setInterval(logDataTick, 10); // 0.01 giây (10ms)/mẫu
    }

    function stopMeasurement() {
        if (mediaStream) mediaStream.getTracks().forEach(track => track.stop());
        if (audioCtx) audioCtx.close();
        
        cancelAnimationFrame(animationId);
        if (autoLogInterval) clearInterval(autoLogInterval); 
        if (measureTimer) clearTimeout(measureTimer);
        
        isMeasuring = false;
        measureBtn.innerText = "Bắt đầu đo";
        measureBtn.className = "start-btn";
        micSelect.disabled = false;
        drawGraphGrid(); // Vẽ lại để sẵn sàng tương tác xem số liệu
    }

    // Nút RESET
    resetBtn.addEventListener('click', () => {
        if (isMeasuring) stopMeasurement();
        
        noiseFloorOffset = 0;
        windowSumDb = 0;
        windowCountFrames = 0;
        dbHistory = [];
        selectedBarIndex = -1;

        dbDisplay.innerText = '0.00'; 
        dbReadout.style.color = 'var(--safe-color)'; 
        dbBox.style.borderColor = 'var(--safe-color)';
        dbBox.style.boxShadow = '0 0 40px rgba(34, 197, 94, 0.15)';
        
        gainRange.value = 1;
        document.getElementById('filterToggle').checked = true;

        drawEmptyGraph();
        statusText.innerText = "Đã làm sạch toàn bộ dữ liệu máy đo.";
    });

    calibrateBtn.addEventListener('click', () => {
        if (analyser && isMeasuring) {
            const buffer = new Uint8Array(analyser.frequencyBinCount);
            analyser.getByteFrequencyData(buffer);
            let sum = buffer.reduce((a, b) => a + b, 0);
            let avg = sum / buffer.length;
            noiseFloorOffset = avg > 0 ? 20 * Math.log10(avg) : 0;
            alert("Hiệu chuẩn tiếng ồn phòng thành công!");
        } else {
            alert("Vui lòng ấn Bắt đầu đo trước khi hiệu chuẩn!");
        }
    });

    function updateUI(db) {
        let formattedDb = db.toFixed(2);
        dbDisplay.innerText = formattedDb;
        
        if (db > 130 || db < 30) {
            dbReadout.style.color = 'var(--danger-color)'; 
            dbBox.style.borderColor = 'var(--danger-color)';
            dbBox.style.boxShadow = '0 0 50px rgba(239, 68, 68, 0.3)';
        } else {
            dbReadout.style.color = 'var(--safe-color)'; 
            dbBox.style.borderColor = 'var(--safe-color)';
            dbBox.style.boxShadow = '0 0 40px rgba(34, 197, 94, 0.15)';
        }
    }

    // Xử lý Sự kiện Chọn Cột khi Chạm/Rê chuột (Hover / Touch / Click)
    function handleCanvasInteract(clientX) {
        if (isMeasuring || dbHistory.length === 0) return;

        const rect = canvas.getBoundingClientRect();
        const mouseX = clientX - rect.left;

        let totalSlots = 1000; // 1000 mẫu trong 10 giây
        let startX = 60;
        let availableWidth = canvas.width - 80;

        if (mouseX >= startX && mouseX <= canvas.width - 20) {
            let relativeX = mouseX - startX;
            let index = Math.floor((relativeX / availableWidth) * dbHistory.length);
            
            if (index >= 0 && index < dbHistory.length) {
                selectedBarIndex = index;
                drawGraphGrid();
            }
        }
    }

    canvas.addEventListener('mousemove', (e) => handleCanvasInteract(e.clientX));
    canvas.addEventListener('click', (e) => handleCanvasInteract(e.clientX));
    canvas.addEventListener('touchstart', (e) => {
        if (e.touches.length > 0) handleCanvasInteract(e.touches[0].clientX);
    });

    // Thuật toán vẽ Đồ thị Cột Năng Lượng (Bar Chart)
    function drawGraphGrid() {
        canvasCtx.fillStyle = '#0f172a';
        canvasCtx.fillRect(0, 0, canvas.width, canvas.height);

        canvasCtx.lineWidth = 1;
        canvasCtx.font = '11px sans-serif';

        let y130 = canvas.height - (130 / GRAPH_MAX_DB) * canvas.height;
        let y30 = canvas.height - (30 / GRAPH_MAX_DB) * canvas.height;

        // Vạch giới hạn 130 dB và 30 dB
        canvasCtx.beginPath();
        canvasCtx.setLineDash([5, 5]);
        canvasCtx.moveTo(0, y130);
        canvasCtx.lineTo(canvas.width, y130);
        canvasCtx.strokeStyle = 'rgba(239, 68, 68, 0.5)';
        canvasCtx.stroke();

        canvasCtx.beginPath();
        canvasCtx.moveTo(0, y30);
        canvasCtx.lineTo(canvas.width, y30);
        canvasCtx.strokeStyle = 'rgba(239, 68, 68, 0.5)';
        canvasCtx.stroke();
        canvasCtx.setLineDash([]);

        // Khung viền đồ thị
        canvasCtx.strokeStyle = 'rgba(255, 255, 255, 0.15)';
        canvasCtx.beginPath();
        canvasCtx.moveTo(0, canvas.height - 1);
        canvasCtx.lineTo(canvas.width, canvas.height - 1);
        canvasCtx.moveTo(1, 0);
        canvasCtx.lineTo(1, canvas.height);
        canvasCtx.stroke();

        canvasCtx.fillStyle = '#94a3b8';
        canvasCtx.fillText(GRAPH_MAX_DB + " dB", 5, 15);
        canvasCtx.fillText("130 dB", 5, y130 - 5);
        canvasCtx.fillText("30 dB", 5, y30 - 5);
        canvasCtx.fillText("0 dB", 5, canvas.height - 5);
        
        let textWidth = canvasCtx.measureText("Thời gian (s) ➔").width;
        canvasCtx.fillText("Thời gian (s) ➔", canvas.width - textWidth - 10, canvas.height - 5);

        // VẼ CÁC CỘT CƯỜNG ĐỘ ÂM
        if (dbHistory.length > 0) {
            let maxDb = Math.max(...dbHistory);
            let minDb = Math.min(...dbHistory);
            
            // Tính toán bề rộng cột cho 1000 mẫu thu được trong 10 giây (0.01s/mẫu)
            let totalSlots = 1000; 
            let availableWidth = canvas.width - 80;
            let barWidth = Math.max(0.8, availableWidth / totalSlots);

            for (let i = 0; i < dbHistory.length; i++) {
                let val = dbHistory[i];
                let barHeight = (val / GRAPH_MAX_DB) * canvas.height;
                let x = 60 + i * barWidth;
                let y = canvas.height - barHeight;

                // Quy tắc tô màu: Max = Đỏ, Min = Xám, Còn lại = Xanh lá
                if (val === maxDb) {
                    canvasCtx.fillStyle = '#ef4444'; // Đỏ (Lớn nhất)
                } else if (val === minDb) {
                    canvasCtx.fillStyle = '#64748b'; // Xám (Nhỏ nhất)
                } else {
                    canvasCtx.fillStyle = '#22c55e'; // Xanh lá (Tiêu chuẩn)
                }

                // Nếu cột này đang được chọn -> Đổi sang màu vàng sáng rực để làm nổi bật
                if (i === selectedBarIndex) {
                    canvasCtx.fillStyle = '#facc15';
                }

                // Vẽ cột
                canvasCtx.fillRect(x, y, Math.max(1, barWidth), barHeight);
            }

            // HIỂN THỊ GIÁ TRỊ THỜI GIAN VÀ CƯỜNG ĐỘ ÂM Ở TRÊN ĐỈNH CỘT ĐƯỢC CHỌN
            if (selectedBarIndex >= 0 && selectedBarIndex < dbHistory.length) {
                let val = dbHistory[selectedBarIndex];
                let timeSec = (selectedBarIndex * 0.01).toFixed(2);
                let barHeight = (val / GRAPH_MAX_DB) * canvas.height;
                let x = 60 + selectedBarIndex * barWidth;
                let y = canvas.height - barHeight;

                // Đường dóng dọc đánh dấu vị trí chọn
                canvasCtx.beginPath();
                canvasCtx.strokeStyle = 'rgba(250, 204, 21, 0.8)';
                canvasCtx.setLineDash([2, 2]);
                canvasCtx.moveTo(x, 0);
                canvasCtx.lineTo(x, canvas.height);
                canvasCtx.stroke();
                canvasCtx.setLineDash([]);

                // Vẽ hộp thoại tooltip chứa thông số
                let text = `t: ${timeSec}s | ${val.toFixed(2)} dB`;
                canvasCtx.font = 'bold 12px monospace';
                let textW = canvasCtx.measureText(text).width;
                
                let boxX = Math.min(Math.max(10, x - textW / 2), canvas.width - textW - 20);
                let boxY = Math.max(25, y - 10);

                canvasCtx.fillStyle = 'rgba(15, 23, 42, 0.95)';
                canvasCtx.fillRect(boxX - 5, boxY - 14, textW + 10, 18);
                canvasCtx.strokeStyle = '#facc15';
                canvasCtx.lineWidth = 1;
                canvasCtx.strokeRect(boxX - 5, boxY - 14, textW + 10, 18);

                canvasCtx.fillStyle = '#facc15';
                canvasCtx.fillText(text, boxX, boxY);
            }
        }
    }

    function drawEmptyGraph() {
        canvas.width = canvas.offsetWidth;
        canvas.height = canvas.offsetHeight;
        drawGraphGrid();
    }

    function visualize() {
        const bufferLength = analyser.frequencyBinCount;
        const dataArray = new Uint8Array(bufferLength);
        
        canvas.width = canvas.offsetWidth;
        canvas.height = canvas.offsetHeight;

        function draw() {
            if (!isMeasuring) return;
            animationId = requestAnimationFrame(draw);
            analyser.getByteTimeDomainData(dataArray);

            let sumSquares = 0;
            for (let i = 0; i < bufferLength; i++) {
                let norm = (dataArray[i] - 128) / 128;
                sumSquares += norm * norm;
            }
            let rms = Math.sqrt(sumSquares / bufferLength);
            
            let db = rms > 0 ? (20 * Math.log10(rms * 100) + 60) - (noiseFloorOffset * 0.1) : 0;
            
            if (db < 0) db = 0;
            if (db > GRAPH_MAX_DB) db = GRAPH_MAX_DB;
            
            currentRmsDb = db;
            updateUI(db);

            windowSumDb += db;
            windowCountFrames++;

            drawGraphGrid();
        }
        draw();
    }
</script>
