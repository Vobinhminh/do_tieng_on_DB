<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dao Động Ký & Cường Độ Âm</title>
    <style>
        :root {
            --bg-top: #1e293b;
            --bg-bottom: #0f172a;
            --panel-bg: rgba(255, 255, 255, 0.1);
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --border-color: rgba(255, 255, 255, 0.2);
            --safe-color: #22c55e;   
            --danger-color: #ef4444; 
            --reset-color: #f59e0b;  
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        /* KHÓA CHẶT TRANG WEB TRONG KHUÔN HÌNH - KHÔNG CUỘN */
        body, html {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: linear-gradient(135deg, var(--bg-top) 0%, var(--bg-bottom) 100%);
            color: var(--text-main);
            height: 100vh;
            width: 100vw;
            overflow: hidden; 
            display: flex;
            flex-direction: column;
        }

        /* ================= TOOLBAR PHÍA TRÊN ================= */
        .top-toolbar {
            background: var(--panel-bg);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border-color);
            padding: 12px 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            z-index: 10;
            flex-shrink: 0;
        }

        .tool-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            flex-wrap: wrap;
        }

        .tool-row label {
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 5px;
            white-space: nowrap;
        }

        select {
            flex: 1;
            padding: 8px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            background: rgba(255,255,255,0.9);
            font-size: 13px;
            outline: none;
            min-width: 120px;
        }

        input[type="range"] {
            width: 100px;
            accent-color: #38bdf8;
        }

        button {
            background-color: #38bdf8;
            color: #0f172a;
            border: none;
            padding: 8px 12px;
            font-size: 13px;
            font-weight: 700;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
        }

        button:active { transform: scale(0.95); }
        button:disabled { background-color: #64748b; color: #cbd5e1; cursor: not-allowed; }
        
        button.start-btn { background-color: var(--safe-color); color: white; flex: 2; padding: 10px; font-size: 14px;}
        button.stop-btn { background-color: var(--danger-color); color: white; flex: 2; padding: 10px; font-size: 14px;}
        button.reset-btn { background-color: var(--reset-color); color: white; flex: 1; padding: 10px; font-size: 14px;}

        #statusText {
            font-size: 12px;
            color: #cbd5e1;
            text-align: center;
            width: 100%;
            margin-top: -4px;
        }

        /* ================= KHU VỰC HIỂN THỊ TRUNG TÂM ================= */
        .main-display {
            flex: 1; 
            display: flex;
            flex-direction: row; 
            padding: 15px;
            gap: 20px;
            min-height: 0; 
            box-sizing: border-box;
        }

        /* BẢNG LỊCH SỬ ĐO */
        .history-panel {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 15px;
            width: 240px;
            height: 100%; 
            z-index: 5;
            backdrop-filter: blur(4px);
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
        }

        .history-panel h3 {
            font-size: 13px;
            color: #38bdf8;
            margin-bottom: 12px;
            text-align: center;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            flex-shrink: 0;
        }

        .history-list {
            list-style: none;
            font-size: 14px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            overflow-y: auto; 
            flex: 1;
            padding-right: 5px;
        }

        .history-list::-webkit-scrollbar { width: 4px; }
        .history-list::-webkit-scrollbar-track { background: rgba(0,0,0,0.1); }
        .history-list::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 10px; }

        .history-list li {
            display: flex;
            justify-content: space-between;
            color: #e2e8f0;
            font-family: monospace;
            font-weight: 600;
            background: rgba(255,255,255,0.05);
            padding: 8px 12px;
            border-radius: 6px;
        }
        
        .history-list li .idx { color: #94a3b8; font-weight: normal; }

        /* ================= KHUNG CHỮ NHẬT LẤP ĐẦY KHÔNG GIAN ================= */
        .db-container {
            flex: 1; 
            height: 100%;
            min-width: 0; 
            min-height: 0; 
            display: flex;
            align-items: stretch;
            justify-content: stretch;
            padding: 0px; 
        }

        .db-box {
            flex: 1; 
            container-type: size; 
            background: rgba(15, 23, 42, 0.5);
            border: 8px solid var(--safe-color); 
            border-radius: 30px; 
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 40px rgba(34, 197, 94, 0.15);
            transition: border-color 0.15s ease-out, box-shadow 0.15s ease-out;
            box-sizing: border-box;
            padding: 5px; 
        }

        .db-readout {
            display: flex;
            align-items: baseline; 
            justify-content: center;
            gap: 1.5cqw; 
            width: 100%;
            color: var(--safe-color); 
            transition: color 0.15s ease-out;
        }

        .db-value {
            font-size: min(19cqw, 65cqh); 
            font-weight: 900;
            color: inherit; 
            line-height: 1;
            font-family: 'Times New Roman', Times, serif; 
            font-variant-numeric: tabular-nums; 
        }

        .db-unit {
            font-size: min(19cqw, 65cqh); 
            font-weight: 900;
            color: inherit; 
            font-family: 'Times New Roman', Times, serif; 
        }

        /* ĐỒ THỊ BIỂU ĐỒ (dB vs Thời gian) */
        .canvas-container {
            width: 100%;
            height: 180px; 
            background: rgba(15, 23, 42, 0.9);
            border-top: 1px solid var(--border-color);
            flex-shrink: 0; 
            position: relative;
        }

        canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* ================= RESPONSIVE ĐIỆN THOẠI (Mobile Layout) ================= */
        @media (max-width: 768px) {
            .main-display {
                flex-direction: column; 
                gap: 12px;
                padding: 10px;
            }
            .history-panel {
                width: 100%;
                height: auto;
                max-height: 150px; 
                padding: 10px;
            }
            .history-list {
                display: grid;
                grid-template-columns: 1fr 1fr; 
                gap: 6px;
            }
            .history-list li {
                padding: 6px 8px;
            }
            .db-container {
                padding: 0;
            }
            .db-box {
                border-width: 6px;
                border-radius: 20px;
            }
            .canvas-container {
                height: 130px; 
            }
        }
    </style>
</head>
<body>

    <!-- BẢNG ĐIỀU KHIỂN -->
    <div class="top-toolbar">
        <div class="tool-row">
            <button id="micBtn">1. Cấp quyền Micro</button>
            <select id="micSelect">
                <option value="">-- Chọn thiết bị thu --</option>
            </select>
        </div>
        
        <div class="tool-row">
            <label>Khuyếch đại: <input type="range" id="gainRange" min="1" max="50" step="0.5" value="1"></label>
            <label><input type="checkbox" id="filterToggle" checked> Lọc âm</label>
            <button id="calibrateBtn">Hiệu chuẩn</button>
        </div>

        <div class="tool-row" style="display: flex;">
            <button id="measureBtn" class="start-btn" disabled>2. Bắt đầu đo</button>
            <button id="resetBtn" class="reset-btn">3. Reset</button>
        </div>
        <div id="statusText">Vui lòng Cấp quyền Micro để bắt đầu.</div>
    </div>

    <!-- GIAO DIỆN HIỂN THỊ CHÍNH -->
    <div class="main-display">
        <!-- BẢNG GHI NHẬN TỰ ĐỘNG -->
        <div class="history-panel">
            <h3>Bảng Số Liệu (4 Mẫu x 2s)</h3>
            <ul class="history-list" id="historyList">
                <!-- Dữ liệu sẽ tự động điền vào đây -->
            </ul>
        </div>

        <!-- KHUNG CHỮ NHẬT LẤP ĐẦY KHÔNG GIAN -->
        <div class="db-container">
            <div id="dbBox" class="db-box">
                <div id="dbReadout" class="db-readout">
                    <div id="dbDisplay" class="db-value">0.00</div>
                    <div class="db-unit">dB</div>
                </div>
            </div>
        </div>
    </div>

    <!-- ĐỒ THỊ BIỂU ĐỒ (dB vs Thời gian) -->
    <div class="canvas-container" id="canvasContainer">
        <canvas id="waveformCanvas"></canvas>
    </div>

<script>
    let audioCtx = null;
    let analyser = null;
    let microphone = null;
    let gainNode = null;
    let biquadFilter = null;
    let mediaStream = null;
    let isMeasuring = false;
    let isPausedForReview = false; 
    let animationId = null;
    let noiseFloorOffset = 0;

    const GRAPH_MAX_DB = 310; 

    // Biến cho bảng ghi nhận tự động (Lấy 4 mẫu, mỗi mẫu 2 giây)
    let autoLogInterval = null;
    let logCount = 0;
    let windowSumDb = 0;
    let windowCountFrames = 0;

    let dbHistory = [];

    const micBtn = document.getElementById('micBtn');
    const measureBtn = document.getElementById('measureBtn');
    const resetBtn = document.getElementById('resetBtn');
    const calibrateBtn = document.getElementById('calibrateBtn');
    
    const dbReadout = document.getElementById('dbReadout');
    const dbDisplay = document.getElementById('dbDisplay');
    const dbBox = document.getElementById('dbBox'); 
    const historyList = document.getElementById('historyList');
    
    const gainRange = document.getElementById('gainRange');
    const filterToggle = document.getElementById('filterToggle');
    const statusText = document.getElementById('statusText');
    const micSelect = document.getElementById('micSelect');
    
    const canvas = document.getElementById('waveformCanvas');
    const canvasCtx = canvas.getContext('2d');

    window.onload = drawEmptyGraph;
    window.onresize = () => { if(!isMeasuring) drawEmptyGraph(); };

    micBtn.addEventListener('click', async () => {
        try {
            let tempStream = await navigator.mediaDevices.getUserMedia({ audio: true });
            const devices = await navigator.mediaDevices.enumerateDevices();
            const audioInputs = devices.filter(device => device.kind === 'audioinput');
            
            micSelect.innerHTML = ''; 
            
            if (audioInputs.length === 0) {
                const option = document.createElement('option');
                option.text = "Không tìm thấy Micro!";
                micSelect.appendChild(option);
                throw new Error("No input devices found.");
            }

            audioInputs.forEach((device, index) => {
                const option = document.createElement('option');
                option.value = device.deviceId;
                option.text = device.label || `Micro ${index + 1}`;
                micSelect.appendChild(option);
            });

            tempStream.getTracks().forEach(track => track.stop());

            micBtn.innerText = "Đã kết nối ✓"; 
            micBtn.style.backgroundColor = "#16a34a"; 
            measureBtn.disabled = false;
            statusText.innerText = "Đã kết nối Micro. Hãy bấm Bắt đầu đo."; 
        } catch (err) {
            alert("Lỗi Micro: Vui lòng cho phép quyền truy cập Micro. " + err);
        }
    });

    gainRange.addEventListener('input', (e) => {
        if (gainNode) gainNode.gain.value = parseFloat(e.target.value);
    });

    filterToggle.addEventListener('change', (e) => {
        if (biquadFilter && audioCtx) {
            biquadFilter.type = e.target.checked ? 'bandpass' : 'allpass';
            biquadFilter.frequency.value = 1000;
        }
    });

    // 2. Bắt đầu đo
    measureBtn.addEventListener('click', async () => {
        if (!isMeasuring) {
            try {
                const selectedDeviceId = micSelect.value;
                const constraints = {
                    audio: {
                        deviceId: selectedDeviceId ? { exact: selectedDeviceId } : undefined,
                        echoCancellation: false, 
                        noiseSuppression: false, 
                        autoGainControl: false
                    },
                    video: false
                };

                mediaStream = await navigator.mediaDevices.getUserMedia(constraints);
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                microphone = audioCtx.createMediaStreamSource(mediaStream);
                
                biquadFilter = audioCtx.createBiquadFilter();
                biquadFilter.type = filterToggle.checked ? 'bandpass' : 'allpass';
                biquadFilter.frequency.value = 1000;

                gainNode = audioCtx.createGain();
                gainNode.gain.value = parseFloat(gainRange.value);

                analyser = audioCtx.createAnalyser();
                analyser.fftSize = 1024;
                analyser.smoothingTimeConstant = 0.8;

                microphone.connect(biquadFilter);
                biquadFilter.connect(gainNode);
                gainNode.connect(analyser);

                isMeasuring = true;
                isPausedForReview = false;
                measureBtn.innerText = "Dừng đo";
                measureBtn.className = "stop-btn";
                micSelect.disabled = true; 
                statusText.innerText = "Đang đo (2s/mẫu)... Đủ 4 mẫu, lần thứ 5 sẽ khóa lên khung chính trong 5 giây.";

                if (logCount >= 4) {
                    logCount = 0;
                    historyList.innerHTML = '';
                    dbHistory = []; 
                }
                
                startAutoLogger();
                visualize();
            } catch (err) {
                alert("Lỗi kết nối Micro: " + err);
            }
        } else {
            stopMeasurement();
            statusText.innerText = "Đã tạm dừng thủ công. Bấm Bắt đầu đo để tiếp tục.";
        }
    });

    function logDataTick() {
        if (!isMeasuring || isPausedForReview) return;

        let avgDb = windowCountFrames > 0 ? (windowSumDb / windowCountFrames) : 0;
        let formattedAvg = avgDb.toFixed(2);

        // Nếu chưa đủ 4 mẫu thì ghi vào bảng
        if (logCount < 4) {
            logCount++;
            const li = document.createElement('li');
            li.innerHTML = `<span class="idx">Lần ${logCount}:</span> <span>${formattedAvg} dB</span>`;
            historyList.appendChild(li);

            windowSumDb = 0;
            windowCountFrames = 0;

            if (logCount < 4) {
                statusText.innerText = `Đang đo... (Mẫu ${logCount}/4)`;
            } else {
                statusText.innerText = `Đã đủ 4 mẫu. Đang chuẩn bị lấy mẫu thứ 5 để hiển thị...`;
            }
        } 
        // Khi đã có 4 mẫu trong bảng, lần chạy tick tiếp theo chính là Mẫu thứ 5
        else {
            isPausedForReview = true;
            
            // Khóa giá trị lần thứ 5 lên khung chính to để quan sát và ghi chép
            dbDisplay.innerText = formattedAvg;
            if (avgDb > 130 || avgDb < 30) {
                dbReadout.style.color = 'var(--danger-color)'; 
                dbBox.style.borderColor = 'var(--danger-color)';
                dbBox.style.boxShadow = '0 0 50px rgba(239, 68, 68, 0.3)';
            } else {
                dbReadout.style.color = 'var(--safe-color)'; 
                dbBox.style.borderColor = 'var(--safe-color)';
                dbBox.style.boxShadow = '0 0 40px rgba(34, 197, 94, 0.15)';
            }

            statusText.innerText = `Kết quả Lần 5: ${formattedAvg} dB. Đang giữ màn hình để ghi chép (5 giây)...`;
            
            setTimeout(() => {
                if (!isMeasuring) return;
                historyList.innerHTML = ''; // Xóa sạch 4 mẫu trên bảng sau khi hết 5 giây
                logCount = 0;               // Reset bộ đếm về 0 để đo đợt mới
                isPausedForReview = false;  // Tiếp tục đo đợt mới
                statusText.innerText = "Đang đo đợt tiếp theo...";
            }, 5000); // 5 giây nghỉ nhìn số liệu
        }
    }

    function startAutoLogger() {
        windowSumDb = 0;
        windowCountFrames = 0;
        if (autoLogInterval) clearInterval(autoLogInterval);
        autoLogInterval = setInterval(logDataTick, 2000); // 2 giây mỗi mẫu
    }

    function stopMeasurement() {
        if (mediaStream) mediaStream.getTracks().forEach(track => track.stop());
        if (audioCtx) audioCtx.close();
        
        cancelAnimationFrame(animationId);
        if (autoLogInterval) clearInterval(autoLogInterval); 
        
        isMeasuring = false;
        isPausedForReview = false;
        measureBtn.innerText = "Bắt đầu đo";
        measureBtn.className = "start-btn";
        micSelect.disabled = false;
    }

    // 3. Nút RESET
    resetBtn.addEventListener('click', () => {
        if (isMeasuring) stopMeasurement();
        
        noiseFloorOffset = 0;
        logCount = 0;
        windowSumDb = 0;
        windowCountFrames = 0;
        historyList.innerHTML = '';
        dbHistory = [];

        dbDisplay.innerText = '0.00'; 
        dbReadout.style.color = 'var(--safe-color)'; 
        dbBox.style.borderColor = 'var(--safe-color)';
        dbBox.style.boxShadow = '0 0 40px rgba(34, 197, 94, 0.15)';
        
        gainRange.value = 1;
        document.getElementById('filterToggle').checked = true;

        drawEmptyGraph();
        statusText.innerText = "Đã làm sạch toàn bộ dữ liệu máy đo.";
    });

    calibrateBtn.addEventListener('click', () => {
        if (analyser && isMeasuring) {
            const buffer = new Uint8Array(analyser.frequencyBinCount);
            analyser.getByteFrequencyData(buffer);
            let sum = buffer.reduce((a, b) => a + b, 0);
            let avg = sum / buffer.length;
            noiseFloorOffset = avg > 0 ? 20 * Math.log10(avg) : 0;
            alert("Hiệu chuẩn tiếng ồn phòng thành công!");
        } else {
            alert("Vui lòng ấn Bắt đầu đo trước khi hiệu chuẩn!");
        }
    });

    function updateUI(db) {
        if (isPausedForReview) return;

        let formattedDb = db.toFixed(2);
        dbDisplay.innerText = formattedDb;
        
        if (db > 130 || db < 30) {
            dbReadout.style.color = 'var(--danger-color)'; 
            dbBox.style.borderColor = 'var(--danger-color)';
            dbBox.style.boxShadow = '0 0 50px rgba(239, 68, 68, 0.3)';
        } else {
            dbReadout.style.color = 'var(--safe-color)'; 
            dbBox.style.borderColor = 'var(--safe-color)';
            dbBox.style.boxShadow = '0 0 40px rgba(34, 197, 94, 0.15)';
        }
    }

    function drawGraphGrid() {
        canvasCtx.fillStyle = '#0f172a';
        canvasCtx.fillRect(0, 0, canvas.width, canvas.height);

        canvasCtx.lineWidth = 1;
        canvasCtx.font = '11px sans-serif';

        let y130 = canvas.height - (130 / GRAPH_MAX_DB) * canvas.height;
        let y30 = canvas.height - (30 / GRAPH_MAX_DB) * canvas.height;

        canvasCtx.beginPath();
        canvasCtx.setLineDash([5, 5]);
        canvasCtx.moveTo(0, y130);
        canvasCtx.lineTo(canvas.width, y130);
        canvasCtx.strokeStyle = 'rgba(239, 68, 68, 0.5)';
        canvasCtx.stroke();

        canvasCtx.beginPath();
        canvasCtx.moveTo(0, y30);
        canvasCtx.lineTo(canvas.width, y30);
        canvasCtx.strokeStyle = 'rgba(239, 68, 68, 0.5)';
        canvasCtx.stroke();
        canvasCtx.setLineDash([]);

        canvasCtx.strokeStyle = 'rgba(255, 255, 255, 0.15)';
        canvasCtx.beginPath();
        canvasCtx.moveTo(0, canvas.height - 1);
        canvasCtx.lineTo(canvas.width, canvas.height - 1);
        canvasCtx.moveTo(1, 0);
        canvasCtx.lineTo(1, canvas.height);
        canvasCtx.stroke();

        canvasCtx.fillStyle = '#94a3b8';
        canvasCtx.fillText(GRAPH_MAX_DB + " dB", 5, 15);
        canvasCtx.fillText("130 dB", 5, y130 - 5);
        canvasCtx.fillText("30 dB", 5, y30 - 5);
        canvasCtx.fillText("0 dB", 5, canvas.height - 5);
        
        let textWidth = canvasCtx.measureText("Thời gian (s) ➔").width;
        canvasCtx.fillText("Thời gian (s) ➔", canvas.width - textWidth - 10, canvas.height - 5);
    }

    function drawEmptyGraph() {
        canvas.width = canvas.offsetWidth;
        canvas.height = canvas.offsetHeight;
        drawGraphGrid();
    }

    function visualize() {
        const bufferLength = analyser.frequencyBinCount;
        const dataArray = new Uint8Array(bufferLength);
        
        canvas.width = canvas.offsetWidth;
        canvas.height = canvas.offsetHeight;

        function draw() {
            if (!isMeasuring) return;
            animationId = requestAnimationFrame(draw);
            analyser.getByteTimeDomainData(dataArray);

            let sumSquares = 0;
            for (let i = 0; i < bufferLength; i++) {
                let norm = (dataArray[i] - 128) / 128;
                sumSquares += norm * norm;
            }
            let rms = Math.sqrt(sumSquares / bufferLength);
            
            let db = rms > 0 ? (20 * Math.log10(rms * 100) + 60) - (noiseFloorOffset * 0.1) : 0;
            
            if (db < 0) db = 0;
            if (db > GRAPH_MAX_DB) db = GRAPH_MAX_DB;
            
            updateUI(db);

            dbHistory.push(db);
            if (dbHistory.length > canvas.width) {
                dbHistory.shift(); 
            }

            if (!isPausedForReview) {
                windowSumDb += db;
                windowCountFrames++;
            }

            drawGraphGrid();

            if (dbHistory.length > 1) {
                let grad = canvasCtx.createLinearGradient(0, 0, 0, canvas.height);
                
                let p130 = (GRAPH_MAX_DB - 130) / GRAPH_MAX_DB; 
                let p30 = (GRAPH_MAX_DB - 30) / GRAPH_MAX_DB;   
                
                grad.addColorStop(0, '#ef4444');        
                grad.addColorStop(Math.max(0, p130), '#ef4444'); 
                grad.addColorStop(Math.min(1, p130 + 0.01), '#22c55e'); 
                grad.addColorStop(Math.max(0, p30 - 0.01), '#22c55e'); 
                grad.addColorStop(Math.min(1, p30), '#ef4444');        
                grad.addColorStop(1, '#ef4444');        

                canvasCtx.beginPath();
                canvasCtx.lineWidth = 2.5;
                canvasCtx.strokeStyle = grad;
                canvasCtx.lineJoin = 'round';

                for (let i = 0; i < dbHistory.length; i++) {
                    let x = i; 
                    let y = canvas.height - (dbHistory[i] / GRAPH_MAX_DB) * canvas.height;
                    
                    if (i === 0) canvasCtx.moveTo(x, y);
                    else canvasCtx.lineTo(x, y);
                }
                canvasCtx.stroke();
            }
        }
        draw();
    }
</script>
